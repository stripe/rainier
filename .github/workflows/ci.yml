name: CI
on:
  pull_request:
env:
  SCALAC_FATAL_WARNINGS: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Set up JDK 11
        uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: scalafmt
        run: sbt scalafmtCheck
      - name: test
        run: sbt '+test'
      - name: docs
        run: sbt 'docs/mdoc'
